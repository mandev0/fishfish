# fish.selimakpinar.com — GitHub Pages'e yayın.
#
# Site burada derlenir ve çıktı doğrudan Pages'e gönderilir; depoda derlenmiş
# dosya tutulmaz. Derlemeden önce veri denetimi ve testler koşar: bozuk bir
# çapraz referans veya kaynaksız yasal kayıt yayına çıkmasın diye.

name: Yayına al

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; sıradaki derlemeyi iptal etmiyoruz ki hiçbir
# değişiklik atlanmasın.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Dockerfile ile aynı sürüm: iki yolun da bit bit aynı çıktı üretmesi,
          # dolayısıyla service worker sürüm damgasının değişmemesi için.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Veri bütünlüğü
        run: npm run validate

      - name: Testler
        run: npm run test

      - name: Tip denetimi
        run: npm run check

      - name: Derleme
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v5 nokta ile başlayan dosyaları varsayılan olarak atıyor; `.nojekyll`
          # bu yüzden düşerdi. Actions ile yayında Jekyll zaten çalışmıyor ama
          # kaynak "Deploy from a branch"e çevrilirse `_astro/` klasörü alt
          # çizgiyle başladığı için yok sayılırdı — dosya sigorta olarak duruyor.
          include-hidden-files: true

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - id: dagitim
        uses: actions/deploy-pages@v5
