# fishfish — statik çıktıyı servis eden nginx.
#
# Bu sunucu TLS sonlandırmaz ve alan adı bilmez: önünde ayrı bir ters vekil
# olduğu varsayılır. Burada yalnızca iki şey yapılıyor — doğru dosyayı bulmak
# ve doğru önbellek başlığını vermek.

server {
    # IPv6 dinlemesi burada açıkça yazılı. nginx imajının giriş betiği bunu
    # kendi eklemeye çalışır ve salt okunur dosya sisteminde "can not modify"
    # bilgisi basar; zararsızdır, dinleme zaten kurulu.
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Çıktının çoğu HTML, CSS ve JS; sıkıştırma boyutu belirgin düşürüyor.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/xml
                      application/javascript application/json
                      application/manifest+json image/svg+xml;

    # MIME türünün tarayıcıya olduğu gibi güvenilmesi
    add_header X-Content-Type-Options "nosniff" always;

    # Sağlık yoklaması — HTML basmadan, günlüğe yazmadan.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Service worker asla önbelleğe alınmaz. Yeni sürümün fark edilmesi
    # tamamen bu dosyanın taze okunmasına bağlı; önbelleğe düşerse kullanıcı
    # eski siteyi haftalarca görebilir.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker'ın önbelleğe alacağı dosya listesi de aynı sebeple taze.
    location = /sw-liste.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # .webmanifest bazı nginx sürümlerinin mime.types dosyasında yok;
    # türü burada açıkça veriyoruz, yoksa octet-stream olarak gidiyor.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Astro'nun ürettiği varlıkların adında içerik özeti var: içerik
    # değişirse ad da değişir, o yüzden süresiz önbelleğe alınabilirler.
    # `^~` şart: aksi hâlde aşağıdaki görsel kuralı (düzenli ifade) bu
    # ön eki geçersiz kılar ve hash'li dosyalar bir haftaya düşer.
    location ^~ /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uygulama simgeleri ve görseller: adlarında özet yok, bir hafta yeter.
    location ~* \.(png|ico|svg|webp|jpe?g|gif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # Site içindeki bağlantılar `/noktalar` der, statik çıktı ise
        # `/noktalar/index.html`. `$uri/index.html` mutlaka `$uri/`den önce
        # gelmeli: aksi hâlde nginx 301 ile sonuna eğik çizgi ekler ve adres,
        # service worker'ın (eğik çizgisiz) önbellek anahtarından ayrışır.
        try_files $uri $uri/index.html $uri/ =404;

        # HTML her zaman doğrulanır: site bir kez derlenip aylarca
        # servis edilebiliyor, kullanıcı eski sayfada kalmamalı.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Ters vekilin arkasında gerçek istemci IP'sini görmek istersen, vekilin
    # adresini yazıp aşağıdaki iki satırı aç:
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
}
