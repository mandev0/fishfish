# fishfish — fish.selimakpinar.com
#
# Kullanım (sunucuda):
#   git pull && docker compose up -d --build
#
# Site imajın içinde derlenir; sunucuda Node kurulu olmasına gerek yok.
# TLS ve alan adı bu dosyanın dışında: önündeki ters vekil 5453'e bağlanır.

name: fishfish

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fishfish:latest
    container_name: fishfish
    restart: unless-stopped

    # Ters vekil aynı makinede olduğu için yalnızca yerel arayüze bağlanıyor;
    # 5453 dışarıdan doğrudan erişilebilir değil.
    # Vekilin kendisi bir kapsayıcıysa bunu "5453:80" yapıp bu servisi
    # vekilin ağına ekle (aşağıdaki networks bölümü).
    ports:
      - "5453:80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Kapsayıcı yalnızca statik dosya okuyor; yazması gereken tek yer
    # nginx'in geçici dizinleri.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Ters vekil kapsayıcıdaysa: aşağıyı ve servisteki networks satırını aç.
# networks:
#   vekil:
#     external: true
